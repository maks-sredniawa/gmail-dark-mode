<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inbox - Gmail</title>
  <style>
    body { margin: 0; font: 14px sans-serif; background: rgb(248, 250, 253); color: rgb(32, 33, 36); }
    .msg { padding: 16px; background: #fff; }
    .banner { width: 64px; height: 32px; background-image: url("/pixel.png"); }
  </style>
</head>
<body>
  <header><img id="wordmark" src="/logo_gmail_lockup_default_1x_r7.png" alt="Gmail" width="109" height="40"></header>
  <main class="a3s">
    <div class="msg">
      <p>A message body with <a href="#">a link</a>.</p>
      <img id="photo" src="/pixel.png" alt="" width="32" height="32">
      <div id="banner" class="banner" style="background-image: url('/pixel.png')">
        <img id="nested" src="/pixel.png" alt="" width="16" height="16">
      </div>
      <picture id="picture"><img id="picture-img" src="/pixel.png" alt="" width="16" height="16"></picture>
      <img id="tan" src="/swatch-200-170-120.svg" alt="" width="32" height="32">
      <img id="red" src="/swatch-220-30-30.svg" alt="" width="32" height="32">
    </div>
  </main>
</body>
</html>
