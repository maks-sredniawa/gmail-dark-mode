<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inbox - Gmail</title>
  <style>
    body { margin: 0; font: 14px sans-serif; background: rgb(248, 250, 253); color: rgb(32, 33, 36); }
    .msg { padding: 16px; background: #fff; }
    .banner { width: 64px; height: 32px; background-image: url("/pixel.png"); }
  </style>
</head>
<body>
  <header><img id="wordmark" src="/logo_gmail_lockup_default_1x_r7.png" alt="Gmail" width="109" height="40"></header>
  <main class="a3s">
    <div class="msg">
      <p>A message body with <a href="#">a link</a>.</p>
      <img id="photo" src="/pixel.png" alt="" width="32" height="32">
      <div id="banner" class="banner" style="background-image: url('/pixel.png')">
        <img id="nested" src="/pixel.png" alt="" width="16" height="16">
      </div>
      <div id="tile" style="width:64px;height:32px;background:url(/pixel.png) center/cover">
        <img id="tile-icon" src="/pixel.png" alt="" width="16" height="16">
      </div>
      <table><tr><td id="cell" background="/pixel.png" width="64" height="32"></td></tr></table>
      <p id="bullet" style="background:url(/pixel.png) no-repeat;padding-left:24px;font:bold 20px sans-serif;color:#222">Text beside a bullet picture</p>
      <table><tr><td id="patterned" background="/swatch-245-245-245.svg" style="font:bold 20px sans-serif;color:#222">Text over a tiled pattern</td></tr></table>
      <div id="hero" style="background:url(/swatch-40-60-90.svg) center/cover;padding:8px;font:bold 20px sans-serif;color:#fff">Headline over a photo</div>
      <picture id="picture"><img id="picture-img" src="/pixel.png" alt="" width="16" height="16"></picture>
      <img id="tan" src="/swatch-200-170-120.svg" alt="" width="32" height="32">
      <img id="red" src="/swatch-220-30-30.svg" alt="" width="32" height="32">
    </div>
  </main>
</body>
</html>
