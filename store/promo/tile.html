<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile 440x280</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden}
body{width:440px;height:280px;position:relative;background:radial-gradient(300px 240px at 330px 160px,#1f2a3d 0,#131314 72%) #131314;color:#e3e3e3;font-family:"Google Sans",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.copy{position:absolute;left:28px;top:34px}
.icon{width:52px;height:52px;display:block;border-radius:12px;box-shadow:0 0 0 1px #3c4b63}
h1{margin:22px 0 0;font-size:35px;line-height:39px;font-weight:700;letter-spacing:-.02em}
h1 span{color:#a8c7fa}
.tag{display:inline-block;margin-top:16px;padding:0 9px;font-size:11px;line-height:20px;letter-spacing:.12em;text-transform:uppercase;color:#a8c7fa;border:1px solid #3c4b63;border-radius:11px}
.card{position:absolute;left:244px;top:40px;width:168px;height:260px;border-radius:12px;background:#fff;overflow:hidden;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.card svg{display:block;position:relative;z-index:2;border-radius:6px}
.brand{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.brand i{width:14px;height:14px;border-radius:50%;background:#0e7c86}
.brand b{width:54px;height:7px;border-radius:4px;background:#12344d}
.line{height:7px;border-radius:4px;background:#c9cdd1;margin-top:8px}
.line.h{height:11px;border-radius:6px;background:#1f1f1f;margin-top:14px;width:74%}
.btn{width:72px;height:22px;border-radius:11px;background:#e4572e;margin-top:14px}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(168,199,250,.3);z-index:3}
.night{position:absolute;left:50%;right:0;top:0;bottom:0;backdrop-filter:invert(.92) hue-rotate(180deg);z-index:1}
.split{position:absolute;left:327px;top:26px;bottom:0;width:2px;background:#a8c7fa;box-shadow:0 0 12px 1px rgba(168,199,250,.55);z-index:3}
.knob{position:absolute;left:313px;top:14px;width:30px;height:30px;border-radius:50%;background:#131314;border:2px solid #a8c7fa;z-index:4;display:grid;place-items:center}
.knob svg{width:15px;height:15px}
</style>
</head>
<body>
<div class="copy">
  <svg class="icon" viewBox="0 0 128 128">
    <rect width="128" height="128" fill="#131314"/>
    <g fill="none" stroke="#a8c7fa" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><rect x="20" y="50" width="76" height="54" rx="9"/><path d="M20 55L58 81L96 55"/></g>
    <circle cx="89" cy="41" r="33" fill="#131314"/>
    <path d="M112.48 49.58A25 25 0 1 1 87.33 16.06A21 21 0 0 0 112.48 49.58Z" fill="#a8c7fa"/>
  </svg>
  <h1><span>Dark Mode</span><br>for Gmail</h1>
  <span class="tag">Unofficial</span>
</div>

<div class="card">
  <div class="brand"><i></i><b></b></div>
  <svg width="144" height="92" viewBox="150 20 300 170" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x2="0" y2="1"><stop offset="0" stop-color="#243b78"/><stop offset=".4" stop-color="#a2507f"/><stop offset=".75" stop-color="#f58a55"/><stop offset="1" stop-color="#ffcf7d"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="#fff4cf"/><stop offset=".2" stop-color="#ffd88a" stop-opacity=".85"/><stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/></radialGradient>
      <linearGradient id="sea" x2="0" y2="1"><stop offset="0" stop-color="#d9735c"/><stop offset=".5" stop-color="#6a4a7e"/><stop offset="1" stop-color="#1d2752"/></linearGradient>
    </defs>
    <rect width="520" height="118" fill="url(#sky)"/>
    <circle cx="290" cy="108" r="110" fill="url(#glow)"/>
    <circle cx="290" cy="104" r="19" fill="#fff8dc"/>
    <rect y="116" width="520" height="74" fill="url(#sea)"/>
    <g fill="#ffd88a"><rect x="252" y="121" width="76" height="4" rx="2" opacity=".9"/><rect x="264" y="131" width="56" height="4" rx="2" opacity=".7"/><rect x="248" y="143" width="80" height="5" rx="2.5" opacity=".5"/><rect x="270" y="157" width="48" height="5" rx="2.5" opacity=".35"/></g>
    <path d="M450 86L420 96 396 108 372 117H450Z" fill="#231a3d"/>
    <path d="M196 115V90L212 113ZM189 116H216L212 122H193Z" fill="#1b1736"/>
  </svg>
  <div class="line h"></div>
  <div class="line"></div>
  <div class="line" style="width:84%"></div>
  <div class="btn"></div>
  <div class="line" style="margin-top:16px"></div>
  <div class="line" style="width:70%"></div>
  <div class="night"></div>
</div>
<div class="split"></div>
<div class="knob"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" fill="#a8c7fa"/></svg></div>
</body>
</html>
