<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before and after 1280x800</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1280px;height:800px;overflow:hidden;background:radial-gradient(900px 600px at 960px 460px,#1f2a3d 0,#131314 70%) #131314;color:#e3e3e3;font-family:"Google Sans",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;grid-template:auto 1fr/1fr 1fr;gap:0 28px;padding:60px 36px 0;align-content:start}
h1{grid-column:1/3;margin:0 0 34px;font-size:40px;line-height:48px;font-weight:700;letter-spacing:-.01em;text-align:center}
h1 span{color:#a8c7fa}
figure{margin:0}
figcaption{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:20px;line-height:32px;color:#c4c7c5}
figcaption b{padding:0 14px;border-radius:16px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #444746;color:#c4c7c5}
.after b{border-color:#a8c7fa;background:#a8c7fa;color:#131314}
.after figcaption{color:#e3e3e3}
.shot{height:540px;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 0 0 1px #37393b,0 24px 60px rgba(0,0,0,.5)}
.after .shot{box-shadow:0 0 0 1px #5a79ad,0 24px 70px rgba(80,120,190,.28)}
/* Crops the 1280x800 capture to the email itself: x 477-1098, y 216-784, at 0.95 scale. */
.shot img{position:absolute;width:1216px;height:760px;left:-453px;top:-205px}
</style>
</head>
<body>
<h1>The whole message goes dark. <span>Photos keep their colours.</span></h1>
<figure>
  <figcaption><b>Before</b>Gmail on its own</figcaption>
  <div class="shot"><img src="../assets/message-light.png" alt=""></div>
</figure>
<figure class="after">
  <figcaption><b>After</b>With Dark Mode for Gmail</figcaption>
  <div class="shot"><img src="../assets/message-dark.png" alt=""></div>
</figure>
</body>
</html>
